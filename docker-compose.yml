# 실행: docker compose up --build  →  http://localhost:8080 (관리자 /admin/)
# LLM은 기본으로 호스트의 Ollama(qwen3:8b)를 쓴다. Ollama도 컨테이너로 띄우려면 (docs/setup.md):
#   .env에 DOCKER_OLLAMA_BASE_URL=http://ollama:11434
#   docker compose --profile ollama up -d --build && docker compose exec ollama ollama pull qwen3:8b
# 컨테이너 안의 Ollama 주소는 로컬 실행용 OLLAMA_BASE_URL(127.0.0.1)과 따로 둔다 — 같은 변수를 쓰면
# .env.example을 복사한 그대로 띄웠을 때 컨테이너가 자기 자신(127.0.0.1)에서 Ollama를 찾는다
services:
  backend:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}     # 관리자 페이지 http://localhost:8080/admin/ (비우면 관리자 API 꺼짐)
      WEEKLY_SCHEDULE: ${WEEKLY_SCHEDULE:-true}   # 정기 브리핑: 매주 월요일 09시(한국 시간) 지난주 브리핑 생성 + 규제 DB 새 버전 확인
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - state:/app/state
    ports:
      - "8000:8000"            # API 문서 http://localhost:8000/docs (화면만 쓸 거면 빼도 된다)

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api/v1
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  ollama:
    image: ollama/ollama:0.11.10
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama

volumes:
  state:
  ollama:
