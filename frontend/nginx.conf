server {
    listen 80;
    root /usr/share/nginx/html;

    # API는 백엔드로. SSE(질문 스트림)가 끊기거나 몰려서 오지 않도록 버퍼링을 끄고 대기 시간을 길게
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location /docs { proxy_pass http://backend:8000; }
    location /openapi.json { proxy_pass http://backend:8000; }

    # 관리자 페이지 — 사용자 화면과 다른 HTML. 데이터는 관리자 토큰이 있어야 API가 내준다
    location = /admin { return 301 /admin/; }
    location /admin/ { try_files $uri /admin.html; }

    # 화면은 한 페이지 앱
    location / {
        try_files $uri $uri/ /index.html;
    }
}
