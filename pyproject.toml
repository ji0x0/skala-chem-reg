[project]
name = "chem-reg-briefing-agent"
version = "0.1.0"
description = "국내외 화학물질 규제 브리핑·영향 분석 에이전트 — LangChain · LangGraph · LangSmith · MCP · FastAPI · Vue"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.150.0",
    "fastmcp>=3.4.9",
    "httpx>=0.28.1",
    "langchain>=1.4.6",
    "langchain-core>=1.6.12",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "mcp>=1.10,<2",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
